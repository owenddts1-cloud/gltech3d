services:
  - type: web
    name: gltech-bot-ofertas
    runtime: node
    plan: free
    region: oregon
    rootDir: services/bot_ofertas
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
