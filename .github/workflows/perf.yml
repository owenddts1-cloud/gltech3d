name: perf

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-size:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          SENTRY_DSN: ""

      - name: Report bundle sizes
        run: |
          {
            echo "## Build output sizes"
            du -sh .next 2>/dev/null || true
            if [ -d .next/static ]; then du -sh .next/static; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Fails (exit 1) when a route's first-load JS exceeds perf-budgets.json.
      - name: Bundle budget
        run: |
          set -o pipefail
          node scripts/check-bundle-budget.mjs | tee bundle-budget.txt
          {
            echo "## Bundle budget"
            echo '```'
            cat bundle-budget.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Needs the build above: without .next it would skip, not pass.
      - name: Bundle isolation (no three.js on the Dashboard)
        run: npx vitest run tests/unit/bundle-isolation.test.ts

      # NOTE: Lighthouse CI deferred (S-12.05 follow-up).
